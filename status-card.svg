<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Status do player: Matheus Marton, nivel 5, Engenheiro de Software">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b14"/><stop offset="1" stop-color="#150a26"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2e88"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<linearGradient id="hp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#ff7ab0"/></linearGradient>
<linearGradient id="mp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#7df3ff"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".04"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'Courier New', Courier, monospace;font-weight:700}
.bar{transform-box:fill-box;transform-origin:left center;animation:fill 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes fill{0%{transform:scaleX(0)}25%{transform:scaleX(1)}88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.pulse{animation:pl 2.5s ease-in-out infinite}
@keyframes pl{50%{stroke-opacity:.35}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
</style>
<rect x="10" y="10" width="880" height="400" rx="14" fill="url(#bg)"/>
<rect x="10" y="10" width="880" height="400" rx="14" fill="url(#scan)"/>
<rect class="pulse" x="10" y="10" width="880" height="400" rx="14" fill="none" stroke="url(#neon)" stroke-width="2.5"/>

<text x="40" y="48" font-size="18" fill="#00e5ff" letter-spacing="3">PLAYER STATUS<tspan class="blink" fill="#ff2e88"> _</tspan></text>
<text x="860" y="48" font-size="18" fill="#ff2e88" text-anchor="end" letter-spacing="2">LV 05</text>
<rect x="40" y="60" width="820" height="2" fill="url(#neon)" opacity=".7"/>

<g class="float">
<rect x="40" y="82" width="120" height="120" rx="10" fill="#0d0d1a" stroke="url(#neon)" stroke-width="3"/>
<text x="100" y="158" font-size="52" fill="#fff" text-anchor="middle" filter="url(#glow)">MM</text>
</g>

<g font-size="16">
<text x="190" y="98"><tspan fill="#8b8fa3">NOME</tspan><tspan x="300" fill="#fff">Matheus Marton</tspan></text>
<text x="190" y="124"><tspan fill="#8b8fa3">CLASSE</tspan><tspan x="300" fill="#ffd23f">Engenheiro de Software</tspan></text>
<text x="190" y="150"><tspan fill="#8b8fa3">SUBCLASSE</tspan><tspan x="300" fill="#fff">Java Back-End + Front-End/UX</tspan></text>
<text x="190" y="176"><tspan fill="#8b8fa3">BASE</tspan><tspan x="300" fill="#fff">Campo Grande, MS (remoto ok)</tspan></text>
<text x="190" y="202"><tspan fill="#8b8fa3">TRILHA</tspan><tspan x="300" fill="#00e5ff">Rock &#183; Anime &#183; Games</tspan></text>
</g>

<g font-size="14">
<text x="640" y="104" fill="#ff2e88">HP</text>
<rect x="675" y="92" width="150" height="12" rx="3" fill="#1c1c2e"/>
<rect class="bar" x="675" y="92" width="127" height="12" rx="3" fill="url(#hp)" style="animation-delay:.1s"/>
<text x="640" y="134" fill="#00e5ff">MP</text>
<rect x="675" y="122" width="150" height="12" rx="3" fill="#1c1c2e"/>
<rect class="bar" x="675" y="122" width="150" height="12" rx="3" fill="url(#mp)" style="animation-delay:.25s"/>
<text x="640" y="164" fill="#ffd23f" font-size="12">CAFE: ABASTECIDO</text>
<text x="640" y="186" fill="#8b5cf6" font-size="12">PLAYLIST: ROCK ON</text>
</g>

<text x="40" y="236" font-size="14" fill="#00e5ff" letter-spacing="3">ATRIBUTOS</text>
<rect x="150" y="231" width="710" height="1" fill="#2a2a44"/>
<text x="40" y="272" font-size="14" fill="#c9d1d9">TROUBLESHOOTING</text><rect x="190" y="260" width="180" height="14" rx="3" fill="#1c1c2e"/><rect class="bar" x="190" y="260" width="162.0" height="14" rx="3" fill="url(#neon)" style="animation-delay:0.00s"/><text x="380" y="272" font-size="13" fill="#ffd23f">90</text><text x="40" y="302" font-size="14" fill="#c9d1d9">SQL</text><rect x="190" y="290" width="180" height="14" rx="3" fill="#1c1c2e"/><rect class="bar" x="190" y="290" width="144.0" height="14" rx="3" fill="url(#neon)" style="animation-delay:0.15s"/><text x="380" y="302" font-size="13" fill="#ffd23f">80</text><text x="40" y="332" font-size="14" fill="#c9d1d9">HTML/CSS/JS</text><rect x="190" y="320" width="180" height="14" rx="3" fill="#1c1c2e"/><rect class="bar" x="190" y="320" width="117.0" height="14" rx="3" fill="url(#neon)" style="animation-delay:0.30s"/><text x="380" y="332" font-size="13" fill="#ffd23f">65</text><text x="460" y="272" font-size="14" fill="#c9d1d9">JAVA</text><rect x="610" y="260" width="180" height="14" rx="3" fill="#1c1c2e"/><rect class="bar" x="610" y="260" width="108.0" height="14" rx="3" fill="url(#neon)" style="animation-delay:0.45s"/><text x="800" y="272" font-size="13" fill="#ffd23f">60</text><text x="460" y="302" font-size="14" fill="#c9d1d9">UX/UI</text><rect x="610" y="290" width="180" height="14" rx="3" fill="#1c1c2e"/><rect class="bar" x="610" y="290" width="99.0" height="14" rx="3" fill="url(#neon)" style="animation-delay:0.60s"/><text x="800" y="302" font-size="13" fill="#ffd23f">55</text><text x="460" y="332" font-size="14" fill="#c9d1d9">SPRING BOOT</text><rect x="610" y="320" width="180" height="14" rx="3" fill="#1c1c2e"/><rect class="bar" x="610" y="320" width="81.0" height="14" rx="3" fill="url(#neon)" style="animation-delay:0.75s"/><text x="800" y="332" font-size="13" fill="#ffd23f">45</text>

<text x="40" y="372" font-size="13" fill="#ffd23f" letter-spacing="2">XP PARA O LV 06: DEV JAVA JUNIOR + FRONT-END</text>
<text x="860" y="372" font-size="13" fill="#ffd23f" text-anchor="end">72%</text>
<rect x="40" y="380" width="820" height="16" rx="4" fill="#1c1c2e"/>
<rect class="bar" x="40" y="380" width="590" height="16" rx="4" fill="url(#neon)" filter="url(#glow)" style="animation-delay:.9s"/>
</svg>
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq 1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
.sl{animation:sl 3.2s linear infinite;opacity:0}
@keyframes sl{0%{transform:translateX(200px);opacity:0}15%{opacity:.55}100%{transform:translateX(-520px);opacity:0}}
.st{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
.g1{fill:#00e5ff;animation:gl1 4s steps(1) infinite}
.g2{fill:#ff2e88;animation:gl2 4s steps(1) infinite}
@keyframes gl1{0%,88%{transform:translate(0,0)}90%{transform:translate(-5px,1px)}93%{transform:translate(4px,-2px)}96%{transform:translate(-3px,0)}100%{transform:translate(0,0)}}
@keyframes gl2{0%,88%{transform:translate(0,0)}90%{transform:translate(5px,-1px)}93%{transform:translate(-4px,2px)}96%{transform:translate(3px,0)}100%{transform:translate(0,0)}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.fade{animation:fd 5s ease-in-out infinite}
@keyframes fd{0%,100%{opacity:.7}50%{opacity:1}}
</style>
